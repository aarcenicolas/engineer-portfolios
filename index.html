<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nicolas Alvarez Arce — Mechanical Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A;
    --bg-2:#151515;
    --bg-3:#1E1E1E;
    --ink:#FFFFFF;
    --muted:#9A9A9A;
    --muted-2:#6E6E6E;
    --line:#2B2B2B;
    --maxw:1240px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter', sans-serif;font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Space Grotesk', sans-serif;margin:0;font-weight:600;
    letter-spacing:-0.01em;color:var(--ink);
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  .media-fill{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;
  }
  /* used in the project modal — shows the whole photo instead of cropping it to fill the frame */
  .media-contain{
    position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;
    background:var(--bg-2);
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 40px;}
  ::selection{background:var(--ink);color:var(--bg);}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;}

  /* ---------- NAV ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    background:transparent;border-bottom:1px solid transparent;
    transition:background .3s ease, border-color .3s ease;
  }
  header.scrolled{background:rgba(10,10,10,0.92);backdrop-filter:blur(10px);border-color:var(--line);}
  .navbar{
    max-width:var(--maxw);margin:0 auto;padding:0 40px;
    display:flex;align-items:center;justify-content:space-between;height:78px;
  }
  .brand{
    font-family:'Space Grotesk', sans-serif;font-size:17px;font-weight:700;
    letter-spacing:0.01em;display:flex;align-items:center;gap:10px;
  }
  .brand .mark{width:8px;height:8px;background:var(--ink);display:inline-block;border-radius:50%;}
  nav ul{list-style:none;display:flex;gap:8px;margin:0;padding:0;}
  nav a{
    font-family:'IBM Plex Mono', monospace;font-size:12px;text-transform:uppercase;
    letter-spacing:0.06em;color:var(--muted);position:relative;padding:10px 12px;
    font-weight:400;display:inline-block;transition:color .15s ease, font-weight .05s;
  }
  nav a:hover, nav a.active{color:var(--ink);font-weight:700;letter-spacing:0.08em;}
  .menu-btn{display:none;background:none;border:none;cursor:pointer;padding:8px;}
  .menu-btn span{display:block;width:22px;height:1.5px;background:var(--ink);margin:5px 0;}

  /* ---------- SHEET LABEL ---------- */
  .sheet-label{display:flex;align-items:baseline;gap:14px;margin-bottom:44px;}
  .sheet-label .num{font-family:'IBM Plex Mono', monospace;color:var(--muted);font-size:12px;font-weight:600;}
  .sheet-label .title{
    font-family:'IBM Plex Mono', monospace;font-size:12px;text-transform:uppercase;
    letter-spacing:0.14em;color:var(--muted);
  }
  .sheet-label .rule{flex:1;height:1px;background:var(--line);}

  section{padding:140px 0;border-bottom:1px solid var(--line);}
  section:last-of-type{border-bottom:none;}

  /* ---------- HERO ---------- */
  .hero{
    min-height:100vh;display:flex;align-items:flex-end;
    padding:180px 0 90px;position:relative;overflow:hidden;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(ellipse 90% 60% at 75% 15%, rgba(255,255,255,0.06), transparent 60%),
      linear-gradient(180deg, #0A0A0A 0%, #0A0A0A 100%);
  }
  .hero-bg-diagram{position:absolute;top:0;right:0;width:60%;max-width:760px;opacity:0.9;pointer-events:none;}
  .hero .wrap{position:relative;z-index:2;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;font-size:12.5px;color:var(--muted);
    text-transform:uppercase;letter-spacing:0.14em;margin-bottom:26px;display:flex;align-items:center;gap:12px;
  }
  .eyebrow::before{content:'';width:28px;height:1px;background:var(--muted-2);}
  .hero h1{
    font-size:clamp(46px,7.2vw,104px);line-height:0.98;margin-bottom:30px;
    text-transform:uppercase;letter-spacing:-0.02em;max-width:900px;
  }
  .hero .role{font-size:19px;color:var(--muted);max-width:560px;margin-bottom:40px;font-family:'Inter';}
  /* hero contact block (replaces the old stat row) */
  .contact-row{display:flex;gap:52px;flex-wrap:wrap;margin-bottom:48px;}
  .contact-row .ci span{
    font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);
    text-transform:uppercase;letter-spacing:0.08em;display:block;margin-bottom:7px;
  }
  .contact-row .ci a{
    font-family:'Space Grotesk';font-size:19px;font-weight:500;color:var(--ink);
    display:inline-flex;align-items:center;gap:7px;
    border-bottom:1px solid rgba(255,255,255,0.18);padding-bottom:2px;
    transition:border-color .18s ease, color .18s ease;
  }
  .contact-row .ci a:hover{border-color:var(--ink);}
  .contact-row .ci a svg{width:15px;height:15px;opacity:.65;flex:0 0 auto;}
  .contact-row .ci a:hover svg{opacity:1;}
  .btn-row{display:flex;gap:16px;flex-wrap:wrap;}
  .btn{
    font-family:'IBM Plex Mono', monospace;font-size:12px;text-transform:uppercase;
    letter-spacing:0.08em;padding:16px 26px;border:1px solid var(--ink);
    display:inline-flex;align-items:center;gap:8px;transition:all .18s ease;
  }
  .btn-primary{background:var(--ink);color:var(--bg);}
  .btn-primary:hover{background:transparent;color:var(--ink);}
  .btn-ghost{border-color:var(--line);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink);}

  /* ---------- ABOUT ---------- */
  .about-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:start;}
  .about-photo{
    aspect-ratio:4/5;background:var(--bg-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .about-photo .corner{position:absolute;width:16px;height:16px;border:1.5px solid var(--muted-2);opacity:.6;}
  .about-photo .corner.tl{top:12px;left:12px;border-right:none;border-bottom:none;}
  .about-photo .corner.tr{top:12px;right:12px;border-left:none;border-bottom:none;}
  .about-photo .corner.bl{bottom:12px;left:12px;border-right:none;border-top:none;}
  .about-photo .corner.br{bottom:12px;right:12px;border-left:none;border-top:none;}
  .about-photo p{font-family:'IBM Plex Mono';font-size:12px;color:var(--muted);text-align:center;padding:24px;}
  /* the experience column is long — keep the intro + education in view beside it */
  .about-copy{position:sticky;top:104px;}
  .about-copy p{margin:0 0 20px;color:var(--ink);max-width:560px;}
  .about-copy .lede{font-size:22px;font-family:'Space Grotesk';font-weight:500;line-height:1.35;}
  .about-copy p:not(.lede){color:var(--muted);}

  /* ---------- LOGO BUBBLE ----------
     Circular logo tile used by Education + Experience entries.
     Falls back to a monogram automatically when no logo file is present. */
  .bubble{
    flex:0 0 auto;width:60px;height:60px;border-radius:50%;
    background:var(--bg-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;
    transition:border-color .25s ease, background .25s ease,
               transform .25s ease, box-shadow .25s ease;
  }
  .bubble img{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1);
    max-width:calc(100% - 8px);max-height:calc(100% - 8px);
    width:auto;height:auto;z-index:2;display:block;
    transition:transform .25s ease;
  }
  /* logos supplied as dark-on-transparent PNG/SVG get lifted to read on dark bg */
  .bubble img.invert{filter:invert(1) grayscale(1) brightness(1.9);}
  /* solid-color logos (e.g. a single brand blue) that read as near-black/illegible
     on the dark bg — flattens to a clean white mark regardless of original hue */
  .bubble img.whiteout{filter:brightness(0) invert(1);}
  /* full-colour brand marks (Boeing, Ruhrpumpen, Walltopia, Vacamsa) sit on a
     clean white disc so the logo reads exactly as the brand intends */
  .bubble.on-light{background:#FFFFFF;border-color:#FFFFFF;}
  .bubble.on-light img{max-width:calc(100% - 6px);max-height:calc(100% - 12px);}
  .bubble .monogram{
    font-family:'Space Grotesk', sans-serif;font-size:15px;font-weight:600;
    letter-spacing:0.02em;color:var(--muted);z-index:1;user-select:none;
    transition:color .25s ease;
  }
  /* once a logo file actually loads, drop the fallback letters behind it —
     otherwise transparent PNGs show the monogram through the artwork */
  .bubble.has-logo .monogram{display:none;}
  .bubble-lg{width:66px;height:66px;}
  .bubble-lg .monogram{font-size:18px;}
  .bubble-lg img{max-width:calc(100% - 10px);max-height:calc(100% - 10px);}

  /* one shared hover behaviour for EVERY bubble — education and experience alike */
  :is(.timeline-item,.edu-item):hover .bubble,
  .bubble:hover{
    border-color:var(--muted-2);transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,0.45);
  }
  :is(.timeline-item,.edu-item):hover .bubble:not(.on-light),
  .bubble:not(.on-light):hover{background:var(--bg-3);}
  :is(.timeline-item,.edu-item):hover .bubble.on-light,
  .bubble.on-light:hover{background:#FFFFFF;border-color:#FFFFFF;}
  :is(.timeline-item,.edu-item):hover .bubble img,
  .bubble:hover img{transform:translate(-50%,-50%) scale(1.08);}
  :is(.timeline-item,.edu-item):hover .bubble .monogram,
  .bubble:hover .monogram{color:var(--ink);}

  /* ---------- EDUCATION ---------- */
  .edu-block{margin-top:36px;padding:24px 0 0;border-top:1px solid var(--line);}
  .edu-block .edu-label{
    font-family:'IBM Plex Mono';font-size:11px;text-transform:uppercase;
    letter-spacing:0.12em;color:var(--muted);margin-bottom:18px;
  }
  .edu-item{display:flex;gap:18px;align-items:flex-start;}
  .edu-item + .edu-item{margin-top:22px;padding-top:22px;border-top:1px solid var(--line);}
  .edu-item h3{font-size:17px;margin-bottom:6px;}
  .edu-item .school{font-family:'IBM Plex Mono';font-size:12.5px;color:var(--ink);margin-bottom:10px;}
  .edu-item .school span{color:var(--muted);display:block;margin-top:2px;}
  .edu-item .coursework{font-size:14px;color:var(--muted);}

  /* ---------- EXPERIENCE TIMELINE ---------- */
  .timeline{margin-top:40px;}
  .timeline-label{
    font-family:'IBM Plex Mono';font-size:11px;text-transform:uppercase;
    letter-spacing:0.12em;color:var(--muted);margin-bottom:6px;
  }
  .timeline-item{
    display:grid;grid-template-columns:60px 1fr;gap:18px;align-items:start;
    padding:22px 0;border-top:1px solid var(--line);
  }
  .timeline-item:last-child{border-bottom:1px solid var(--line);}
  .timeline-item .when{
    font-family:'IBM Plex Mono';font-size:11.5px;color:var(--muted);
    display:block;margin-bottom:6px;
  }
  .timeline-item h4{font-size:15px;margin-bottom:5px;}
  .timeline-item .org{font-size:13px;color:var(--ink);margin-bottom:7px;font-weight:500;font-family:'IBM Plex Mono';}
  .timeline-item p{margin:0;font-size:14px;color:var(--muted);}

  /* ---------- PROJECTS: GRID + MODAL ---------- */
  .filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:36px;}
  .filter-btn{
    font-family:'IBM Plex Mono';font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;
    padding:9px 16px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--muted);
    transition:all .15s ease;
  }
  .filter-btn:hover{border-color:var(--ink);color:var(--ink);}
  .filter-btn.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}

  .proj-grid{
    display:grid;grid-template-columns:repeat(3, 1fr);gap:1px;
    background:var(--line);border:1px solid var(--line);
  }
  .proj-card{
    background:var(--bg);cursor:pointer;display:flex;flex-direction:column;
    transition:background .2s ease;
  }
  .proj-card:hover{background:var(--bg-2);}
  .proj-visual{
    aspect-ratio:4/3;background:var(--bg-2);display:flex;align-items:center;justify-content:center;
    position:relative;border-bottom:1px solid var(--line);
  }
  .proj-card:hover .proj-visual{background:var(--bg-3);}
  .proj-visual svg{width:34%;height:34%;opacity:0.85;transition:opacity .2s ease, transform .3s ease;}
  .proj-card:hover .proj-visual svg{opacity:1;transform:scale(1.06);}
  .proj-idx{position:absolute;top:14px;left:14px;font-family:'IBM Plex Mono';font-size:10.5px;color:var(--muted);}
  .media-count{
    position:absolute;top:14px;right:14px;z-index:3;
    font-family:'IBM Plex Mono';font-size:10px;color:var(--ink);letter-spacing:0.04em;
    background:rgba(10,10,10,0.6);border:1px solid rgba(255,255,255,0.18);
    padding:4px 9px;border-radius:20px;backdrop-filter:blur(2px);
  }
  .proj-body{padding:22px 24px 26px;flex:1;display:flex;flex-direction:column;}
  .proj-cat{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;}
  .proj-body h3{font-size:16.5px;margin-bottom:8px;transition:letter-spacing .15s ease;}
  .proj-card:hover .proj-body h3{letter-spacing:0.01em;}
  .proj-body p{font-size:13.5px;color:var(--muted);margin:0;flex:1;}
  .proj-more{
    font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:0.05em;margin-top:16px;display:flex;align-items:center;gap:6px;
  }
  .proj-card:hover .proj-more{color:var(--ink);font-weight:700;}
  .proj-card.hidden{display:none;}

  /* modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);
    z-index:200;display:flex;align-items:flex-start;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .25s ease;overflow-y:auto;padding:60px 20px;
  }
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .modal{
    background:var(--bg);border:1px solid var(--line);max-width:820px;width:100%;
    transform:translateY(24px);transition:transform .3s ease;position:relative;
  }
  .modal-overlay.open .modal{transform:translateY(0);}
  .modal-close{
    position:absolute;top:20px;right:20px;border:1px solid rgba(255,255,255,0.25);
    background:rgba(10,10,10,0.62);backdrop-filter:blur(3px);
    color:var(--ink);width:38px;height:38px;font-size:20px;cursor:pointer;z-index:5;
    display:flex;align-items:center;justify-content:center;transition:border-color .15s ease, background .15s ease;
  }
  .modal-close:hover{border-color:var(--ink);background:rgba(10,10,10,0.9);}
  .modal-visual{
    background:var(--bg-2);border-bottom:1px solid var(--line);
    position:relative;overflow:hidden;
  }
  /* single photo / video / icon slide */
  .modal-visual.is-media{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;}
  /* contact-sheet slide: every still from the project, laid out as one board */
  .modal-visual.is-layout{padding:18px 18px 40px;}
  .modal-visual svg{width:16%;opacity:0.9;}

  /* ---------- PROJECT LAYOUT BOARD ---------- */
  .mv-layout{display:grid;gap:10px;}
  .mv-layout.row-3{grid-template-columns:repeat(3,1fr);}
  .mv-layout.pair{grid-template-columns:repeat(2,1fr);}
  .mv-layout.quad{grid-template-columns:repeat(2,1fr);}
  .mv-layout.hero-2{grid-template-columns:repeat(2,1fr);}
  .mv-layout.hero-2 .tile:first-child{grid-column:1 / -1;aspect-ratio:auto;height:clamp(230px,38vh,420px);}
  .mv-layout.stack{grid-template-columns:1fr;}
  .mv-layout .tile{
    position:relative;aspect-ratio:4/3;background:var(--bg);
    border:1px solid var(--line);overflow:hidden;cursor:zoom-in;
    transition:border-color .18s ease, transform .18s ease;
  }
  /* every board shows the WHOLE image — no cropping of the work. The frame around
     an off-ratio image is an intentional mat, not empty space. */
  .mv-layout.quad .tile{aspect-ratio:auto;height:clamp(210px,32vh,320px);}
  .mv-layout.hero-2 .tile:not(:first-child){aspect-ratio:auto;height:clamp(185px,28vh,300px);}
  .mv-layout.row-3 .tile{aspect-ratio:auto;height:clamp(180px,24vh,250px);}
  .mv-layout.stack .tile{aspect-ratio:auto;height:clamp(160px,27vh,320px);}
  .mv-layout .tile img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;padding:6px;}
  .mv-layout .tile:hover{border-color:var(--muted-2);transform:translateY(-2px);}
  .mv-layout .tile .zoom{
    position:absolute;bottom:8px;right:8px;font-family:'IBM Plex Mono';font-size:9.5px;
    color:var(--ink);background:rgba(10,10,10,0.65);border:1px solid rgba(255,255,255,0.18);
    padding:3px 7px;border-radius:20px;opacity:0;transition:opacity .18s ease;
  }
  .mv-layout .tile:hover .zoom{opacity:1;}

  /* video / embed slide */
  .mv-embed{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .mv-soon{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;text-align:center;padding:32px;color:var(--muted);
  }
  .mv-soon .play{
    width:56px;height:56px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--muted);
  }
  .mv-soon p{margin:0;font-family:'IBM Plex Mono';font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;}
  .modal-visual.is-media img.media-contain{cursor:zoom-in;}
  .mv-caption{
    position:absolute;bottom:14px;left:14px;z-index:4;font-family:'IBM Plex Mono';font-size:10px;
    color:var(--ink);background:rgba(10,10,10,0.6);border:1px solid rgba(255,255,255,0.18);
    padding:4px 9px;border-radius:20px;backdrop-filter:blur(2px);
  }

  /* full-size image lightbox (click any tile) */
  .lightbox{
    position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.94);
    display:none;align-items:center;justify-content:center;padding:48px;cursor:zoom-out;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;}
  .gallery-nav{
    position:absolute;top:50%;transform:translateY(-50%);z-index:4;
    width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,0.25);
    background:rgba(10,10,10,0.55);color:var(--ink);font-size:18px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    backdrop-filter:blur(2px);transition:background .15s ease, border-color .15s ease;
  }
  .gallery-nav:hover{background:rgba(10,10,10,0.85);border-color:var(--ink);}
  .gallery-nav.prev{left:16px;} .gallery-nav.next{right:16px;}
  .gallery-dots{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:4;
    display:flex;gap:7px;
  }
  .gallery-dots .dot{
    width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.35);
    cursor:pointer;transition:background .15s ease, transform .15s ease;
  }
  .gallery-dots .dot.active{background:var(--ink);transform:scale(1.2);}
  .modal-body{padding:44px 48px 48px;}
  .modal-cat{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:16px;}
  .modal-body h2{font-size:clamp(24px,3vw,32px);text-transform:uppercase;letter-spacing:-0.01em;margin-bottom:18px;}
  .modal-desc{color:var(--muted);font-size:15.5px;max-width:560px;margin:0 0 28px;}
  .modal-stats{display:flex;gap:44px;margin-bottom:28px;flex-wrap:wrap;padding-top:24px;border-top:1px solid var(--line);}
  .modal-stats .fs b{display:block;font-family:'Space Grotesk';font-size:24px;color:var(--ink);}
  .modal-stats .fs span{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;}
  .modal-bullets{margin:0 0 28px;padding-left:18px;color:var(--muted);font-size:14.5px;}
  .modal-bullets li{margin-bottom:8px;}
  .modal-tags{display:flex;gap:8px;flex-wrap:wrap;}
  .modal-tags span{
    font-family:'IBM Plex Mono';font-size:10.5px;color:var(--ink);border:1px solid var(--line);
    padding:5px 10px;text-transform:uppercase;letter-spacing:0.03em;
  }

  /* ---------- LEADERSHIP ---------- */
  .lead-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);}
  .lead-card{padding:32px;background:var(--bg);transition:background .2s ease;}
  .lead-card:hover{background:var(--bg-2);}
  .lead-card .role{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px;}
  .lead-card h3{font-size:17px;margin-bottom:12px;text-transform:uppercase;letter-spacing:-0.005em;}
  .lead-card p{font-size:13.5px;color:var(--muted);margin:0;}

  /* ---------- CERTIFICATIONS ---------- */
  .cert-list{border-top:1px solid var(--line);}
  .cert-row{
    display:grid;grid-template-columns:100px 1fr;gap:24px;align-items:baseline;
    padding:26px 0;border-bottom:1px solid var(--line);
  }
  .cert-row .cert-date{font-family:'IBM Plex Mono';font-size:12px;color:var(--muted);}
  .cert-row h3{font-size:17px;margin-bottom:5px;}
  /* the certificate title IS the link — no separate "view" column */
  .cert-row h3 a{
    border-bottom:1px solid rgba(255,255,255,0.22);padding-bottom:1px;
    transition:border-color .15s ease,color .15s ease;
  }
  .cert-row h3 a:hover{border-color:var(--ink);}
  .cert-row h3 a .ext{font-size:12px;color:var(--muted);margin-left:5px;}
  .cert-row .issuer{font-size:13.5px;color:var(--muted);font-family:'IBM Plex Mono';}
  /* grouped box — several certificates from one issuer in a single row */
  .cert-items{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:9px;}
  .cert-items li{font-size:15px;display:flex;align-items:baseline;gap:9px;}
  .cert-items li::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--muted-2);flex:0 0 auto;transform:translateY(-3px);}
  .cert-items a{
    border-bottom:1px solid rgba(255,255,255,0.22);padding-bottom:1px;
    transition:border-color .15s ease;
  }
  .cert-items a:hover{border-color:var(--ink);}
  .cert-items a .ext{font-size:12px;color:var(--muted);margin-left:5px;}

  /* ---------- HOBBIES ---------- */
  .hobby-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);}
  .hobby-card{
    background:var(--bg-2);aspect-ratio:16/11;position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:flex-end;padding:32px;
  }
  .hobby-card .hobby-icon{position:absolute;top:28px;left:28px;color:var(--muted-2);opacity:.6;z-index:2;}
  .hobby-card.has-media::after{
    content:'';position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg, rgba(10,10,10,0.05) 30%, rgba(10,10,10,0.85) 100%);
  }
  .hobby-card.has-media .hobby-icon{display:none;}
  .hobby-card h3, .hobby-card p{position:relative;z-index:2;}
  .hobby-card h3{font-size:22px;margin-bottom:8px;text-transform:uppercase;}
  .hobby-card p{font-size:13.5px;color:var(--muted);margin:0;max-width:380px;}

  /* ---------- HOBBIES GALLERY (Outdoors & Photography) ---------- */
  .hobby-gallery{grid-column:1 / -1;background:var(--bg-2);padding:32px 32px 28px;position:relative;}
  .hobby-gallery .hg-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:20px;flex-wrap:wrap;}
  .hobby-gallery .hg-head h3{font-size:22px;text-transform:uppercase;margin:0 0 6px;}
  .hobby-gallery .hg-head p{font-size:13.5px;color:var(--muted);margin:0;max-width:520px;}
  .hobby-gallery .hg-hint{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;white-space:nowrap;}
  .hg-viewport{position:relative;}
  .hg-strip{
    display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;
    padding-bottom:10px;scrollbar-width:thin;scrollbar-color:var(--muted-2) transparent;
  }
  .hg-strip::-webkit-scrollbar{height:6px;}
  .hg-strip::-webkit-scrollbar-track{background:transparent;}
  .hg-strip::-webkit-scrollbar-thumb{background:var(--muted-2);border-radius:20px;}
  .hg-item{
    flex:0 0 auto;height:clamp(190px,32vh,300px);scroll-snap-align:center;position:relative;
    background:var(--bg);border:1px solid var(--line);overflow:hidden;cursor:zoom-in;
    transition:border-color .18s ease, transform .18s ease;
  }
  .hg-item:hover{border-color:var(--muted-2);transform:translateY(-2px);}
  .hg-item img{height:100%;width:auto;max-width:none;object-fit:cover;display:block;}
  .hg-item[data-loading]{width:60px;}
  .hg-nav{
    position:absolute;top:calc(50% - 5px);transform:translateY(-50%);width:40px;height:40px;
    border:1px solid rgba(255,255,255,0.22);background:rgba(10,10,10,0.6);backdrop-filter:blur(3px);
    color:var(--ink);font-size:20px;cursor:pointer;z-index:3;display:flex;align-items:center;
    justify-content:center;border-radius:50%;transition:border-color .15s ease, background .15s ease, opacity .15s ease;
  }
  .hg-nav:hover{border-color:var(--ink);background:rgba(10,10,10,0.85);}
  .hg-nav.prev{left:8px;} .hg-nav.next{right:8px;}

  /* ---------- FOOTER ---------- */
  footer{padding:64px 0 48px;}
  .footer-grid{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:24px;}
  footer .brand{margin-bottom:10px;}
  footer .contact-links{display:flex;gap:22px;flex-wrap:wrap;}
  footer .contact-links a{font-family:'IBM Plex Mono';font-size:12.5px;color:var(--muted);border-bottom:1px solid transparent;}
  footer .contact-links a:hover{color:var(--ink);border-color:var(--ink);}
  .back-top{font-family:'IBM Plex Mono';font-size:12px;color:var(--muted);}
  .back-top:hover{color:var(--ink);}

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:860px){
    nav{
      position:fixed;top:78px;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);
      transform:translateY(-8px);opacity:0;pointer-events:none;transition:all .2s ease;
    }
    nav.open{transform:translateY(0);opacity:1;pointer-events:auto;}
    nav ul{flex-direction:column;padding:24px 40px;gap:6px;}
    .menu-btn{display:block;}
    .hero-bg-diagram{opacity:0.3;width:100%;}
    .about-grid{grid-template-columns:1fr;gap:48px;}
    .about-copy{position:static;}
    .about-photo{max-width:340px;}
    .proj-grid{grid-template-columns:1fr 1fr;}
    .lead-grid{grid-template-columns:1fr;}
    .hobby-grid{grid-template-columns:1fr;}
    .cert-row{grid-template-columns:1fr;gap:8px;}
    .modal-body{padding:32px 24px 36px;}
    .mv-layout.row-3{grid-template-columns:1fr 1fr;}
    .mv-layout.row-3 .tile:first-child{grid-column:1 / -1;}
    section{padding:90px 0;}
  }
  @media (max-width:560px){
    .wrap{padding:0 22px;}
    .navbar{padding:0 22px;}
    .contact-row{gap:26px;}
    .contact-row .ci a{font-size:17px;}
    .proj-grid{grid-template-columns:1fr;}
    .mv-layout.row-3,.mv-layout.quad,.mv-layout.hero-2{grid-template-columns:1fr;}
    .modal-visual.is-layout{padding:12px 12px 36px;}
    .lightbox{padding:20px;}
    .bubble{width:44px;height:44px;}
    .bubble-lg{width:50px;height:50px;}
    .bubble .monogram{font-size:13px;}
    .bubble-lg .monogram{font-size:15px;}
    .timeline-item{grid-template-columns:44px 1fr;gap:14px;}
    .edu-item{gap:14px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; scroll-behavior:auto !important;}
  }
</style>

/* ---- logo bubble ----
   Renders a circular logo tile. If `logo` is empty OR the file fails to load,
   it silently falls back to the monogram — so the page never shows a broken image.
   Set `invert:true` on an entry whose logo is dark artwork on a transparent bg. */
function bubble(entry, size){
  const mono = entry.monogram || (entry.org || entry.school || '?')
    .replace(/[^A-Za-z ]/g,'').trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
  const cls = 'bubble' + (size === 'lg' ? ' bubble-lg' : '') + (entry.onLight ? ' on-light' : '');
  const filterClass = entry.forceWhite ? 'whiteout' : (entry.invert ? 'invert' : '');
  // onload → hide the monogram so it never shows through a transparent logo
  // onerror → drop the broken image and keep the monogram as the fallback
  const img = entry.logo
    ? `<img src="${entry.logo}" alt="${entry.org || entry.school || ''} logo"
            class="${filterClass}" loading="lazy"
            onload="this.parentNode.classList.add('has-logo')"
            onerror="this.remove()">`
    : '';
  return `<div class="${cls}"><span class="monogram">${mono}</span>${img}</div>`;
}

// card thumbnail: shows the first media item, plus a badge describing what's inside
function cardVisual(p, iconSvg){
  const list = p.media || [];
  if(!list.length) return iconSvg || '';
  // `thumb` (optional) overrides which still is used on the card
  const m = p.thumb ? {type:'image', src:p.thumb} : list[0];
  const el = m.type === 'video'
    ? `<video class="media-fill" src="${m.src}" muted loop playsinline></video>`
    : `<img class="media-fill" src="${m.src}" alt="">`;
  const bits = [];
  if(list.length > 1) bits.push(`${list.length} photos`);
  if(p.feature) bits.push(p.feature.type === 'image' ? 'presentation' : 'video');
  const badge = bits.length ? `<span class="media-count mono">${bits.join(' · ')}</span>` : '';
  return el + badge;
}

/* ---- modal gallery ----
   Slide 1 = the layout board (every still at once, click a tile to zoom)
   Slide 2 = the feature — video or presentation
   Slides 3+ = each still, full size                                        */
function buildSlides(p){
  const imgs = p.media || [];
  const slides = [];
  if(imgs.length > 1 && p.layout !== 'none') slides.push({type:'layout', layout:p.layout || 'row-3', items:imgs});
  if(p.feature) slides.push(p.feature);
  imgs.forEach(m => slides.push(m));
  return slides;
}

let modalMedia = [];
let modalIndex = 0;
let modalIconFallback = '';

function slideHtml(m){
  if(m.type === 'layout'){
    return `<div class="mv-layout ${m.layout}">` + m.items.map(it => `
      <div class="tile" data-full="${it.src}">
        <img src="${it.src}" alt="${it.caption || ''}" loading="lazy">
        <span class="zoom mono">${it.caption ? it.caption + ' · ' : ''}zoom</span>
      </div>`).join('') + `</div>`;
  }
  if(m.type === 'youtube'){
    return m.id
      ? `<iframe class="mv-embed" src="https://www.youtube.com/embed/${m.id}?rel=0"
                 title="${m.caption || 'Video'}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                 allowfullscreen></iframe>`
      : `<div class="mv-soon">
           <span class="play"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
           <p>${m.caption || 'Video'} — coming soon</p>
         </div>`;
  }
  if(m.type === 'video'){
    return `<video class="media-contain" src="${m.src}" autoplay muted loop playsinline controls></video>`;
  }
  return `<img class="media-contain" src="${m.src}" alt="${m.caption || ''}">`
       + (m.caption ? `<span class="mv-caption">${m.caption}</span>` : '');
}

function renderModalMedia(){
  const container = document.getElementById('modalVisual');
  container.classList.remove('is-layout','is-media');
  if(!modalMedia.length){
    container.classList.add('is-media');
    container.innerHTML = modalIconFallback;
    return;
  }
  const m = modalMedia[modalIndex];
  container.classList.add(m.type === 'layout' ? 'is-layout' : 'is-media');

  let nav = '';
  if(modalMedia.length > 1){
    nav += `<button class="gallery-nav prev" id="galPrev" aria-label="Previous">‹</button>`;
    nav += `<button class="gallery-nav next" id="galNext" aria-label="Next">›</button>`;
    nav += `<div class="gallery-dots">${modalMedia.map((_,i) => `<span class="dot${i===modalIndex?' active':''}" data-i="${i}"></span>`).join('')}</div>`;
  }
  container.innerHTML = slideHtml(m) + nav;

  if(modalMedia.length > 1){
    document.getElementById('galPrev').addEventListener('click', () => { modalIndex = (modalIndex - 1 + modalMedia.length) % modalMedia.length; renderModalMedia(); });
    document.getElementById('galNext').addEventListener('click', () => { modalIndex = (modalIndex + 1) % modalMedia.length; renderModalMedia(); });
    container.querySelectorAll('.dot').forEach(d => d.addEventListener('click', () => { modalIndex = +d.dataset.i; renderModalMedia(); }));
  }
  container.querySelectorAll('.tile').forEach(t =>
    t.addEventListener('click', () => openLightbox(t.dataset.full)));
  const solo = container.querySelector('img.media-contain');
  if(solo) solo.addEventListener('click', () => openLightbox(solo.getAttribute('src')));
}

/* ---- hobby image gallery ----
   Fully automatic: just drop images into assets/hobbies/ named p1, p2, p3 …
   Nothing here needs editing. The loader walks p1 upward, tries a few common
   extensions for each, and appends whatever it finds — in order. There is NO
   fixed limit: it keeps going until it sees a run of GAP_STOP missing numbers,
   so you can grow the gallery to any size. Small gaps in the numbering are fine. */
const HG_EXTS = ['jpg','JPG','jpeg','png','PNG','webp'];
const HG_GAP_STOP = 6;    // stop after this many consecutive missing numbers
const HG_HARD_CAP = 300;  // absolute safety ceiling (you'll never reach this)

// resolve the first extension that actually loads for a given "assets/hobbies/pN"
function hgFindImage(base){
  return new Promise(resolve => {
    let i = 0;
    const probe = new Image();
    probe.onload  = () => resolve(probe.src);
    probe.onerror = () => { i++; (i < HG_EXTS.length) ? (probe.src = base + '.' + HG_EXTS[i]) : resolve(null); };
    probe.src = base + '.' + HG_EXTS[0];
  });
}
async function hgLoadImages(strip, prefix){
  let n = 1, gap = 0;
  while(gap < HG_GAP_STOP && n <= HG_HARD_CAP){
    const src = await hgFindImage(prefix + n);
    if(src){
      gap = 0;
      const fig = document.createElement('figure');
      fig.className = 'hg-item';
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = 'Nicolas — outdoors & photography';
      img.src = src;
      fig.appendChild(img);
      strip.appendChild(fig);
    } else {
      gap++;
    }
    n++;
  }
}
function galleryHtml(h){
  return `
    <div class="hobby-gallery">
      <div class="hg-head">
        <div><h3>${h.title}</h3><p>${h.desc}</p></div>

      </div>
      <div class="hg-viewport">
        <button class="hg-nav prev" aria-label="Previous">‹</button>
        <div class="hg-strip"></div>
        <button class="hg-nav next" aria-label="Next">›</button>
      </div>
    </div>`;
}

/* ---- wire up the gallery: arrows, click-to-zoom, gentle auto-advance ---- */
(function initHobbyGallery(){
  const strip = document.querySelector('.hg-strip');
  if(!strip) return;
  const prev = document.querySelector('.hg-nav.prev');
  const next = document.querySelector('.hg-nav.next');
  const stepWidth = () => {
    const item = strip.querySelector('.hg-item:not([data-loading])');
    return item ? item.getBoundingClientRect().width + 12 : 260;
  };
  const atEnd = () => strip.scrollLeft + strip.clientWidth >= strip.scrollWidth - 4;
  if(prev) prev.addEventListener('click', () => strip.scrollBy({left:-stepWidth(), behavior:'smooth'}));
  if(next) next.addEventListener('click', () => strip.scrollBy({left: stepWidth(), behavior:'smooth'}));
  // click any frame to open it full size in the existing lightbox
  strip.addEventListener('click', e => {
    const img = e.target.closest('.hg-item img');
    if(img) openLightbox(img.currentSrc || img.src);
  });
  // gentle auto-advance; pauses on hover or manual interaction
  let timer = setInterval(advance, 3800);
  function advance(){
    if(atEnd()) strip.scrollTo({left:0, behavior:'smooth'});
    else strip.scrollBy({left:stepWidth(), behavior:'smooth'});
  }
  function pause(){ clearInterval(timer); timer = null; }
  function resume(){ if(!timer) timer = setInterval(advance, 3800); }
  strip.addEventListener('mouseenter', pause);
  strip.addEventListener('mouseleave', resume);
  strip.addEventListener('touchstart', pause, {passive:true});
})();

/* ---- modal logic ---- */
const modalOverlay = document.getElementById('modalOverlay');
function openModal(p){
  modalMedia = buildSlides(p);
  modalIndex = 0;
  modalIconFallback = ICONS[p.icon] || '';
  renderModalMedia();
  document.getElementById('modalCat').textContent = p.tagline;
  document.getElementById('modalTitle').textContent = p.title;
  document.getElementById('modalDesc').textContent = p.fullDesc;
  document.getElementById('modalStats').innerHTML = p.stats.map(s => `<div class="fs"><b>${s.value}</b><span>${s.label}</span></div>`).join('');
  document.getElementById('modalBullets').innerHTML = p.bullets.map(b => `<li>${b}</li>`).join('');
  document.getElementById('modalTags').innerHTML = p.tags.map(t => `<span>${t}</span>`).join('');
  modalOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  modalOverlay.classList.remove('open');
  document.getElementById('modalVisual').innerHTML = '';   // stops any playing video
  document.body.style.overflow = '';
}
document.getElementById('modalClose').addEventListener('click', closeModal);
modalOverlay.addEventListener('click', e => { if(e.target === modalOverlay) closeModal(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(lightbox.classList.contains('open')){ closeLightbox(); return; }
    closeModal();
  }
  if(lightbox.classList.contains('open')) return;
  if(!modalOverlay.classList.contains('open') || modalMedia.length < 2) return;
  if(e.key === 'ArrowRight'){ modalIndex = (modalIndex + 1) % modalMedia.length; renderModalMedia(); }
  if(e.key === 'ArrowLeft'){ modalIndex = (modalIndex - 1 + modalMedia.length) % modalMedia.length; renderModalMedia(); }
});

/* ---- scrollspy ---- */
const links = document.querySelectorAll('.nav-link');
const sections = [...links].map(l => document.querySelector(l.getAttribute('href')));
const spy = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      const id = '#' + entry.target.id;
      links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === id));
    }
  });
}, {rootMargin: '-45% 0px -50% 0px'});
sections.forEach(s => s && spy.observe(s));

const cards = document.querySelectorAll('.proj-card');
filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.filter;
    cards.forEach(c => c.classList.toggle('hidden', f !== 'all' && c.dataset.cat !== f));
  });
});
